<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
        background-image: url("haikei.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
      }

      .omikuji-result {
        position: relative;
        margin: 30px auto;
        width: min(900px, 85vw);
        min-height: 220px;

        display: flex;
        align-items: center;
        justify-content: center;

        box-sizing: border-box;
        padding: 30px;

        font-size: 56px;
        font-weight: 900;
        letter-spacing: 8px;
        text-align: center;

        color: #fff;

        /* パチンコ液晶っぽい黒〜赤の背景 */
        background: radial-gradient(
          circle at center,
          #5c0000 0%,
          #210000 45%,
          #050505 100%
        );

        /* 金色の枠 */
        border: 8px solid #d4af37;
        border-radius: 18px;

        /* 外側の筐体っぽい影 */
        box-shadow:
          0 0 0 5px #111,
          0 0 0 10px #8c6b18,
          0 0 25px rgba(255, 200, 0, 0.8),
          inset 0 0 30px rgba(255, 0, 0, 0.5);

        overflow: hidden;

        /* 結果が表示されたときの発光 */
        animation: result-glow 1.5s ease-in-out infinite alternate;
      }

      /* 液晶画面の走査線っぽい演出 */
      .omikuji-result::before {
        content: "";
        position: absolute;
        inset: 0;

        background: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.03) 0px,
          rgba(255, 255, 255, 0.03) 2px,
          transparent 2px,
          transparent 6px
        );

        pointer-events: none;
      }

      /* 中央の結果文字 */
      .omikuji-result {
        text-shadow:
          0 0 5px #fff,
          0 0 10px #ffcc00,
          0 0 20px #ff6600,
          0 0 35px #ff0000;
      }

      /* 電飾っぽい光 */
      @keyframes result-glow {
        from {
          box-shadow:
            0 0 0 5px #111,
            0 0 0 10px #8c6b18,
            0 0 20px rgba(255, 180, 0, 0.5),
            inset 0 0 25px rgba(255, 0, 0, 0.4);
        }

        to {
          box-shadow:
            0 0 0 5px #111,
            0 0 0 10px #d4af37,
            0 0 45px rgba(255, 220, 0, 1),
            inset 0 0 40px rgba(255, 0, 0, 0.7);
        }
      }

      .omikuji-controls {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 32px;
        justify-content: center;
        height: 70px;
      }

      .omikuji-controls button {
        cursor: pointer;
      }

      .btn--orange {
        transition: all 0.1s ease;
        color: #fff;
        background-color: #eb6100;
        border-bottom: 5px solid #b84c00;
        font-size: 24px;
        padding: 16px 36px;
        border-radius: 8px;
      }
      .btn--orange:hover {
        color: #fff;
        background: #f5dd00;
        box-shadow: 0 0 12px rgba(255, 251, 0, 0.6);
        border-bottom-width: 1px;
      }
      .btn--shadow {
        -webkit-box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
        box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
      }

      .btn--orange:active {
        transform: translateY(5px);
        border-bottom-width: 0px;
      }

      .btn--reset {
        font-size: 18px;
        padding: 12px 24px;
        color: #00f2fe;
        background-color: #1a1d24;
        border: 1px solid #00f2fe;
        border-bottom: 5px solid #008891;
        border-radius: 4px;
        font-weight: bold;
        letter-spacing: 1px;
        transition: all 0.1s ease;
      }

      /* ホバー時の効果 */
      .btn--reset:hover {
        color: #ffffff;
        background-color: #00889a;
        transform: translateY(3px);
        border-bottom-width: 2px;
      }

      /* クリックした瞬間 */
      .btn--reset:active {
        transform: translateY(5px);
        border-bottom-width: 0px;
      }

      .count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 10px auto 0;
        padding: 8px 20px;

        background: #ffffff;
        border: 2px solid #e0e0e0;
        border-radius: 50px; /* 丸みを持たせる */
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);

        font-size: 15px;
        font-weight: bold;
        color: #555555;
        transition: all 0.3s ease;
      }
      /* =========================
   大吉：激アツ演出
   ========================= */

      .omikuji-result.gekiaTsu {
        animation:
          gekiaTsu-flash 0.18s infinite alternate,
          gekiaTsu-shake 0.08s infinite;

        color: #fff700;

        text-shadow:
          0 0 5px #ffffff,
          0 0 10px #fff700,
          0 0 20px #ff9900,
          0 0 40px #ff0000,
          0 0 70px #ff0000;

        border-color: #fff700;

        background: radial-gradient(
          circle at center,
          #ffcc00 0%,
          #ff3300 30%,
          #800000 65%,
          #050505 100%
        );
      }

      /* 激しく明滅 */
      @keyframes gekiaTsu-flash {
        from {
          box-shadow:
            0 0 0 5px #111,
            0 0 0 10px #d4af37,
            0 0 30px #ff0000,
            0 0 60px #ffcc00,
            inset 0 0 30px #ff0000;
        }

        to {
          box-shadow:
            0 0 0 5px #fff,
            0 0 0 12px #fff700,
            0 0 50px #ff0000,
            0 0 100px #ffff00,
            inset 0 0 60px #ffff00;
        }
      }

      /* パチンコ台っぽく少し揺らす */
      @keyframes gekiaTsu-shake {
        0% {
          transform: translate(0, 0) scale(1);
        }

        25% {
          transform: translate(-2px, 1px) scale(1.02);
        }

        50% {
          transform: translate(2px, -1px) scale(1.03);
        }

        75% {
          transform: translate(-1px, -2px) scale(1.02);
        }

        100% {
          transform: translate(1px, 2px) scale(1);
        }
      }
      /* 「大吉」文字専用のインパクトスタイル */
.daikichi-impact {
  display: inline-block;
  font-size: 1.3em;
  font-weight: 900;
  
  /* 黄金グラデーション文字 */
  background: linear-gradient(180deg, #fff2a3 0%, #ffd700 50%, #b8860b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  /* 画面手前にドカンと飛んでくるアニメーション */
  animation: daikichi-drop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  filter: drop-shadow(0 0 20px #ffea00);
  position: relative;
  z-index: 2;
}

/* 後方で回転する集中線オーラ */
.daikichi-aura {
  position: absolute;
  width: 300px;
  height: 300px;
  background: repeating-conic-gradient(
    from 0deg,
    rgba(255, 215, 0, 0.4) 0deg 15deg,
    transparent 15deg 30deg
  );
  border-radius: 50%;
  animation: aura-spin 4s linear infinite;
  pointer-events: none;
  z-index: 1;
}

/* --- アニメーション定義 --- */

/* 奥から手前にドカンと落下して叩きつけられる */
@keyframes daikichi-drop {
  0% {
    transform: scale(4) translateY(-50px);
    opacity: 0;
  }
  100% {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
}

/* 後光がくるくる回転する */
@keyframes aura-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

    </style>
  </head>

  <body>
    <h1 class="daimei" style="color: white;">おみくじアプリ</h1>
    <p style="color: white; background-color: black; width: 400px;">
    「おみくじを引く」ボタンを押してみましょう。
    </p>

    <!--
      結果を表示する場所。render.ts が id="result" を取得して書き換える。
      ステップ1 を実装するまでは、この固定の文言のまま変わらない。
    -->
    <div id="result" class="omikuji-result">ここに結果が出ます</div>

    <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
    <div class="omikuji-controls">
      <button class="btn--orange btn--shadow" id="draw-button">
        おみくじを引く
      </button>
      <audio id="draw-sound" preload="auto">
      <source src="juggler_D78rKvIQ.mp3" type="audio/mp3">
    </audio>  

      <button class="btn--reset btn--shadow" id="reset-button">リセット</button>
      <audio id="reset-sound" preload="auto">
      <source src="Juggler レバー-edited-2026-08-30T05-52-54.mp3" type="audio/mp3">
    </audio>
    </div>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。使わないうちは消してもよい。
        - 残りくじ枚数を出す → <div id="remaining">
        - 引いた履歴を出す   → <ul id="history"> に <li> を足していく
    -->
    <div id="remaining" class="count">0</div>
    <ul id="history" class="omikuji-history"></ul>
    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <audio id="gekiatsu-sound" preload="auto">
  <source src="OgGTKDf6.mp3" type="audio/mp3">
</audio>

   <audio id="daikichi-sound" preload="auto">
  <source src="y2mateis-best_v9Qhmg9p.mp3" type="audio/mp3">
</audio>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
