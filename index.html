<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      .omikuji-result {
        margin: 16px 0;
        padding: 16px;
        font-size: 32px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 8px;
        height: 48px;
        display: flex;
        align-content: center;
        align-items: center;
      }

      .omikuji-controls {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 32px;
        justify-content: center;
        height: 70px;
      }

      .omikuji-controls button {
        cursor: pointer;
      }

      .btn--orange {
        transition: all 0.1s ease;
       color: #fff;
       background-color: #eb6100;
       border-bottom: 5px solid #b84c00;
       font-size: 24px;
       padding: 16px 36px;
       border-radius: 8px;
      }
      .btn--orange:hover {
       color: #fff;
       background: #f5dd00;
       box-shadow: 0 0 12px rgba(255,251,0,0.6);
       border-bottom-width: 1px;
      }
      .btn--shadow {
       -webkit-box-shadow: 0 3px 5px rgba(0, 0, 0, .3);
       box-shadow: 0 3px 5px rgba(0, 0, 0, .3);
      }

      .btn--orange:active {
        transform: translateY(5px);
        border-bottom-width: 0px;
      }

      .btn--reset {
        font-size: 18px;
        padding: 12px 24px;
  color: #00f2fe;
  background-color: #1a1d24;
  border: 1px solid #00f2fe;
  border-bottom: 5px solid #008891;
  border-radius: 4px;
  font-weight: bold;
  letter-spacing: 1px;
  transition: all 0.1s ease;
}

/* ホバー時の効果 */
.btn--reset:hover {
  color: #ffffff;
  background-color: #00889a;
  transform: translateY(3px);
  border-bottom-width: 2px;
}

/* クリックした瞬間 */
.btn--reset:active {
  transform: translateY(5px);
  border-bottom-width: 0px;
}

.count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 10px auto 0;
  padding: 8px 20px;

  background: #ffffff;
  border: 2px solid #e0e0e0;
  border-radius: 50px; /* 丸みを持たせる */
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  
  font-size: 15px;
  font-weight: bold;
  color: #555555;
  transition: all 0.3s ease;
}
    </style>
  </head>

  <body>
    <h1>おみくじアプリ</h1>
    <p>「おみくじを引く」ボタンを押してみましょう。</p>

    <!--
      結果を表示する場所。render.ts が id="result" を取得して書き換える。
      ステップ1 を実装するまでは、この固定の文言のまま変わらない。
    -->
    <div id="result" class="omikuji-result">ここに結果が出ます</div>

    <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
    <div class="omikuji-controls">
      <button class="btn--orange btn--shadow" id="draw-button">おみくじを引く</button>
      <button class="btn--reset btn--shadow" id="reset-button">リセット</button>
    </div>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。使わないうちは消してもよい。
        - 残りくじ枚数を出す → <div id="remaining">
        - 引いた履歴を出す   → <ul id="history"> に <li> を足していく
    -->
    <div id="remaining" class="count">0</div>
    <ul id="history" class="omikuji-history"></ul>
    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
